<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Shipment Proformas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">SHIPMENT</p>
    <h1>Pending Shipment Proforma Invoices</h1>
    <p class="subtitle">Only pending shipment proforma invoices are listed.</p>

    <form id="search-form" class="search">
      <label for="proforma-name">Proforma Name</label>
      <div class="search-row">
        <select id="proforma-name" name="proformaNo" aria-label="Proforma Name">
          <option value="">All pending shipment proformas</option>
        </select>
        <button type="submit">Search</button>
        <button id="clear-button" type="button" class="secondary">Clear</button>
        <button id="export-button" type="button" class="secondary">Export to Excel</button>
      </div>
    </form>

    <section class="summary" aria-label="Summary">
      <div><span>Product Lines</span><strong id="row-count">0</strong></div>
      <div><span>Checked In</span><strong id="received-total">0</strong></div>
      <div><span>Outstanding</span><strong id="waiting-total">0</strong></div>
    </section>

    <section class="panel">
      <div class="panel-title"><h2>Details</h2><span id="status" role="status">Ready</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="index" aria-sort="none"><button class="sort-button" type="button" data-sort-key="index">No.<span class="sort-icon" aria-hidden="true"></span></button></th>
            <th aria-sort="none"><button class="sort-button" type="button" data-sort-key="product_name">Product Name<span class="sort-icon" aria-hidden="true"></span></button></th>
            <th aria-sort="none"><button class="sort-button" type="button" data-sort-key="invoice_no">Proforma No.<span class="sort-icon" aria-hidden="true"></span></button></th>
            <th class="number" aria-sort="none"><button class="sort-button number" type="button" data-sort-key="total">Checked In<span class="sort-icon" aria-hidden="true"></span></button></th>
            <th class="number" aria-sort="none"><button class="sort-button number" type="button" data-sort-key="waiting">Outstanding<span class="sort-icon" aria-hidden="true"></span></button></th>
          </tr></thead>
          <tbody id="result-body"><tr><td colspan="5" class="empty">Select a proforma name and search.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <template id="initial-row"><tr><td colspan="5" class="empty">Select a proforma name and search.</td></tr></template>
  <template id="empty-row"><tr><td colspan="5" class="empty">No matching records found.</td></tr></template>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
